<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信公众号文章编辑器 - 微信编辑器</title>
    
    <!-- 引入 Quill.js CSS -->
    <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
    
    <!-- 引入自定义样式 -->
    <link rel="stylesheet" href="style.css">
    
    <!-- 引入字体（用于墨韵模板） -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航栏 -->
        <header class="header">
            <div class="header-left">
                <div class="logo">W</div>
                <h1 class="app-title">微信公众号编辑器</h1>
            </div>
            <div class="header-actions">
                <button id="clear-btn" class="btn btn-secondary">
                    <span>🗑️</span>
                    <span>清空</span>
                </button>
                <button id="copy-btn" class="btn btn-success">
                    <span>📋</span>
                    <span>复制到微信</span>
                </button>
            </div>
        </header>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 左侧编辑区 -->
            <section class="editor-section">
                <!-- 模板和背景色选择器（紧凑布局） -->
                <div class="template-selector">
                    <div class="selector-row">
                        <div class="template-list" id="template-list">
                            <!-- 模板项由JS动态生成 -->
                        </div>
                    </div>
                    <div class="selector-row">
                        <div class="bg-color-picker" id="bg-color-picker">
                            <!-- 背景色由JS动态生成 -->
                        </div>
                        <div class="bg-color-custom">
                            <input type="color" id="bg-color-custom-input" value="#ffffff" class="custom-color-input" title="自定义背景色">
                        </div>
                    </div>
                </div>

                <!-- 编辑工作区：组件面板 + 编辑器 横向排列 -->
                <div class="editor-workspace">
                    <!-- 组件面板 -->
                    <div class="component-panel">
                        <div class="component-panel-header">
                            <h3>📦 插入组件</h3>
                            <div class="save-status" id="save-status">
                                <span class="save-dot"></span>
                                <span class="save-text">已保存</span>
                            </div>
                        </div>
                        
                        <!-- 颜色选择器 -->
                        <div class="color-picker-section">
                            <span class="color-picker-label">主题色：</span>
                            <div class="color-picker" id="component-color-picker">
                                <!-- 颜色由JS动态生成 -->
                            </div>
                        </div>
                        
                        <!-- 组件分类Tab -->
                        <div class="component-tabs" id="component-tabs">
                            <!-- Tab由JS动态生成 -->
                        </div>
                        
                        <!-- 组件列表 -->
                        <div class="component-list" id="component-list">
                            <!-- 组件由JS动态生成 -->
                        </div>
                    </div>

                    <!-- 编辑器容器 -->
                <div class="editor-container">
                    <!-- Quill 工具栏 -->
                    <div id="toolbar">
                        <!-- 标题 -->
                        <span class="ql-formats">
                            <select class="ql-header">
                                <option value="1">标题1</option>
                                <option value="2">标题2</option>
                                <option value="3">标题3</option>
                                <option selected>正文</option>
                            </select>
                        </span>
                        
                        <!-- 字体 -->
                        <span class="ql-formats">
                            <select class="ql-font">
                                <option selected>默认字体</option>
                                <option value="serif">宋体</option>
                                <option value="monospace">等宽字体</option>
                            </select>
                        </span>
                        
                        <!-- 字号 -->
                        <span class="ql-formats">
                            <select class="ql-size">
                                <option value="small">小</option>
                                <option value="false">中</option>
                                <option value="large">大</option>
                                <option value="huge">特大</option>
                            </select>
                        </span>
                        
                        <!-- 加粗、斜体、下划线、删除线 -->
                        <span class="ql-formats">
                            <button class="ql-bold" title="加粗"></button>
                            <button class="ql-italic" title="斜体"></button>
                            <button class="ql-underline" title="下划线"></button>
                            <button class="ql-strike" title="删除线"></button>
                        </span>
                        
                        <!-- 颜色、背景色 -->
                        <span class="ql-formats">
                            <select class="ql-color" title="文字颜色">
                                <option value=""></option>
                                <option value="#000000">黑色</option>
                                <option value="#666666">灰色</option>
                                <option value="#999999">浅灰</option>
                                <option value="#cc0000">红色</option>
                                <option value="#e65100">橙色</option>
                                <option value="#1a73e8">蓝色</option>
                                <option value="#2e7d32">绿色</option>
                                <option value="#880e4f">紫色</option>
                            </select>
                            <select class="ql-background" title="背景色">
                                <option value=""></option>
                                <option value="#ffcccc">浅红</option>
                                <option value="#fff3cd">浅黄</option>
                                <option value="#cce5ff">浅蓝</option>
                                <option value="#d4edda">浅绿</option>
                                <option value="#f3e5f5">浅紫</option>
                            </select>
                        </span>
                        
                        <!-- 对齐方式 -->
                        <span class="ql-formats">
                            <button class="ql-align" value="" title="左对齐">
                                <svg viewBox="0 0 18 18">
                                    <path d="M2 3h14v2H2zM2 8h9v2H2zM2 13h12v2H2z"></path>
                                </svg>
                            </button>
                            <button class="ql-align" value="center" title="居中对齐">
                                <svg viewBox="0 0 18 18">
                                    <path d="M2 3h14v2H2zM5 8h8v2H5zM3 13h12v2H3z"></path>
                                </svg>
                            </button>
                            <button class="ql-align" value="right" title="右对齐">
                                <svg viewBox="0 0 18 18">
                                    <path d="M2 3h14v2H2zM7 8h9v2H7zM4 13h12v2H4z"></path>
                                </svg>
                            </button>
                            <button class="ql-align" value="justify" title="两端对齐">
                                <svg viewBox="0 0 18 18">
                                    <path d="M2 3h14v2H2zM2 8h14v2H2zM2 13h14v2H2z"></path>
                                </svg>
                            </button>
                        </span>
                        
                        <!-- 引用 -->
                        <span class="ql-formats">
                            <button class="ql-blockquote" title="引用"></button>
                        </span>
                        
                        <!-- 列表 -->
                        <span class="ql-formats">
                            <button class="ql-list" value="ordered" title="有序列表"></button>
                            <button class="ql-list" value="bullet" title="无序列表"></button>
                        </span>
                        
                        <!-- 缩进 -->
                        <span class="ql-formats">
                            <button class="ql-indent" value="-1" title="减少缩进"></button>
                            <button class="ql-indent" value="+1" title="增加缩进"></button>
                        </span>
                        
                        <!-- 链接、图片 -->
                        <span class="ql-formats">
                            <button class="ql-link" title="插入链接"></button>
                            <button class="ql-image" title="插入图片"></button>
                        </span>
                        
                        <!-- 清除格式 -->
                        <span class="ql-formats">
                            <button class="ql-clean" title="清除格式"></button>
                        </span>
                        
                        <!-- 草稿功能按钮 -->
                        <span class="ql-formats draft-actions">
                            <button class="btn-toolbar-draft" id="save-draft-btn" title="保存草稿">💾</button>
                            <button class="btn-toolbar-draft" id="draft-box-btn" title="草稿箱">📁</button>
                            <button class="btn-toolbar-draft" id="copy-html-btn" title="复制HTML">📋</button>
                        </span>
                        
                        <!-- 导入文章按钮 -->
                        <span class="ql-formats import-actions">
                            <button class="btn-toolbar-draft" id="import-article-btn" title="导入公众号文章">📥</button>
                        </span>
                    </div>
                    
                    <!-- Quill 编辑器主体 -->
                    <div id="editor"></div>
                </div>
                </div><!-- editor-workspace 结束 -->
            </section>

            <!-- 右侧预览区 -->
            <aside class="preview-section">
                <div class="preview-title">📱 手机预览</div>
                
                <!-- iPhone 模拟器 -->
                <div class="iphone-frame">
                    <div class="iphone-screen">
                        <!-- 状态栏 -->
                        <div class="iphone-status-bar">
                            <span class="status-time">09:41</span>
                            <div class="status-icons">
                                <span>📶</span>
                                <span>🔋</span>
                            </div>
                        </div>
                        
                        <!-- 预览内容 -->
                        <div class="preview-content-wrapper">
                            <div id="preview-content" class="preview-content template-classicBlue">
                                <!-- 预览内容由JS动态生成 -->
                            </div>
                        </div>
                    </div>
                </div>
                
                <p class="help-text">* 预览效果可能因微信版本略有差异</p>
            </aside>
        </main>
    </div>

    <!-- 引入 Quill.js -->
    <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
    
    <!-- 引入模板定义 -->
    <script src="templates.js"></script>
    
    <!-- 引入组件库 -->
    <script src="components.js"></script>
    
    <!-- 引入编辑器逻辑 -->
    <script src="editor.js"></script>
</body>
</html>
